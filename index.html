<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <!-- Zoom ist ausdrücklich erlaubt (Barrierefreiheit, Bericht Abschnitt 3). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- PWA / Android -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#F4A435" />

  <!-- PWA / iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Lernwelten" />

  <meta name="description" content="Lern-App für die Volksschule: Mathe, Deutsch, Sachwissen und Logik in kurzen Runden." />
  <meta name="application-name" content="Lernwelten" />
  <meta name="format-detection" content="telephone=no" />

  <title>Lernwelten</title>

  <link rel="manifest" href="manifest.json" />

  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16x16.png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="assets/icons/icon-152x152.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />

  <!--
    Schriften liegen lokal in assets/fonts (SIL Open Font License).
    Es werden bewusst keine externen Dienste eingebunden — weder Schriften
    noch Analysefunktionen. Siehe README.
  -->
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/village.css" />
  <link rel="stylesheet" href="css/workshop.css" />
  <link rel="stylesheet" href="css/modules.css" />
  <link rel="stylesheet" href="css/parents.css" />
  <link rel="stylesheet" href="css/oskar.css" />
  <link rel="stylesheet" href="css/print.css" media="print" />
</head>
<body>
  <!-- App-Root: alle Bildschirme werden hier per JavaScript gerendert. -->
  <div id="app">
    <div class="boot-screen">
      <span class="boot-logo" aria-hidden="true">🌟</span>
      <p>Lernwelten wird geladen …</p>
    </div>
  </div>

  <!-- Installationshinweis: wird erst nach einer abgeschlossenen Runde gezeigt. -->
  <div id="pwa-install-banner" role="status" aria-label="App installieren">
    <span class="banner-icon" aria-hidden="true">🌟</span>
    <div class="banner-text">
      <p class="banner-title">Lernwelten installieren</p>
      <p class="banner-hint" id="pwa-install-hint">Tippe auf „Zum Home-Bildschirm".</p>
    </div>
    <button class="banner-btn" id="pwa-install-btn" type="button" style="display:none">Installieren</button>
    <button class="banner-close" id="pwa-install-close" type="button" aria-label="Hinweis schließen">✕</button>
  </div>

  <!--
    Ladereihenfolge — Abhängigkeiten beachten:
      1. core/util.js       keine Abhängigkeiten
      2. core/topics.js     braucht Util
      3. core/answer.js     braucht Util
      4. core/storage.js    braucht Util, Topics
      5. core/progress.js   braucht Util, Topics, Storage
      6. core/rewards.js    braucht Util
      7. core/timers.js     keine Abhängigkeiten
      8. ui/clock.js        keine Abhängigkeiten
      9. ui/widgets.js      braucht Util
     10. content/*          Daten, brauchen nichts
     11. generators/*       brauchen Util, Widgets, Clock, Content, AnswerCheck
     12. ui/dom.js          braucht Util, Timers, Storage
     13. ui/taskview.js     braucht UI, Widgets, Timers
     14. core/session.js    braucht alles davor
     15. ui/*, features/*   Bildschirme
     16. app.js             startet nach DOMContentLoaded
     17. pwa.js             Service Worker und Update-Banner
  -->
  <script src="js/core/util.js"></script>
  <script src="js/core/topics.js"></script>
  <script src="js/core/answer.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/progress.js"></script>
  <script src="js/core/rewards.js"></script>
  <script src="js/core/timers.js"></script>

  <script src="js/ui/clock.js"></script>
  <script src="js/ui/widgets.js"></script>

  <script src="js/content/words-data.js"></script>
  <script src="js/content/german-data.js"></script>
  <script src="js/content/science-data.js"></script>
  <script src="js/content/logic-data.js"></script>

  <script src="js/generators/math-gen.js"></script>
  <script src="js/generators/german-gen.js"></script>
  <script src="js/generators/misc-gen.js"></script>
  <script src="js/generators/index.js"></script>

  <script src="js/ui/dom.js"></script>
  <script src="js/ui/taskview.js"></script>
  <script src="js/oskar.js"></script>
  <script src="js/core/session.js"></script>

  <script src="js/ui/profile.js"></script>
  <script src="js/ui/workshop.js"></script>
  <script src="js/features/toolbox.js"></script>
  <script src="js/features/album.js"></script>
  <script src="js/features/shop.js"></script>
  <script src="js/features/mirror.js"></script>
  <script src="js/features/worksheet.js"></script>
  <script src="js/features/daily.js"></script>
  <script src="js/features/parents.js"></script>

  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
