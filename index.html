<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Lernwelt" />
  <meta name="theme-color" content="#FFF8F0" />
  <meta name="description" content="Lernwelt – das Lernspiel für Volksschulkinder der 1. und 2. Klasse" />

  <title>Lernwelt 🌟</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/village.css" />
  <link rel="stylesheet" href="css/workshop.css" />
</head>
<body>
  <!--
    App-Root: alle Screens werden hier per JavaScript gerendert.
    Der initiale Inhalt wird sofort durch App.init() ersetzt.
  -->
  <div id="app" role="main" aria-label="Lernwelt">
    <div style="display:flex;align-items:center;justify-content:center;height:100dvh;font-size:52px;">
      🌟
    </div>
  </div>

  <!--
    Ladereihenfolge (Abhängigkeiten beachten):
      1. storage.js   — Persistenz (keine Abhängigkeiten)
      2. adaptive.js  — Adaptives System (braucht Storage)
      3. profile.js   — Profil-Logik (braucht Storage)
      4. math.js      — Mathe-Modul (braucht Storage, Adaptive)
      5. app.js       — Controller; startet App nach DOMContentLoaded

    Neues Fach hinzufügen:
      <script src="js/modules/deutsch.js"></script>
      und in app.js BUILDINGS-Array registrieren.
  -->
  <script src="js/storage.js"></script>
  <script src="js/adaptive.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/modules/math.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
